apiVersion: v1
kind: ConfigMap
metadata:
  name: meetai-backend-config
  namespace: meetai
  labels:
    app.kubernetes.io/name: ai-meeting-summarizer
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "5000"
  FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://ai-meeting-summarizer-ashy-omega.vercel.app

  DATABASE_SSL: "true"

  TRANSCRIPTION_MODEL: deepgram
  DEEPGRAM_MODEL: nova-2

  LLM_PROVIDER: huggingface
  HUGGINGFACE_CHAT_MODEL: openai/gpt-oss-20b

  EMBEDDING_PROVIDER: huggingface
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_DIMENSIONS: "384"
  HUGGINGFACE_EMBEDDING_PROVIDER: hf-inference
  EMBEDDING_WORKER_CONCURRENCY: "2"
  EMBEDDING_JOB_ATTEMPTS: "3"
  EMBEDDING_JOB_BACKOFF_MS: "5000"

  RAG_CHUNK_WORDS: "220"
  RAG_CHUNK_OVERLAP_WORDS: "40"
  RAG_MAX_CHUNKS: "6"
  RAG_CHAT_HISTORY_MESSAGES: "10"

  AUDIO_STORAGE_PROVIDER: r2
  AUDIO_COMPRESS_RECORDINGS: "true"
  AUDIO_STORAGE_FORMAT: mp3
  AUDIO_COMPRESSION_BITRATE_KBPS: "48"
  AUDIO_COMPRESSION_TIMEOUT_MS: "600000"
  R2_REGION: auto
  R2_KEY_PREFIX: recordings

  NOTION_ENABLED: "false"
