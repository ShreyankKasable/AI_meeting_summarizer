apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetai-embedding-worker
  namespace: meetai
  labels:
    app.kubernetes.io/name: ai-meeting-summarizer
    app.kubernetes.io/component: embedding-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-meeting-summarizer
      app.kubernetes.io/component: embedding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-meeting-summarizer
        app.kubernetes.io/component: embedding-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: embedding-worker
          image: ghcr.io/shreyankkasable/ai_meeting_summarizer/backend:latest
          imagePullPolicy: Always
          command:
            - node
            - backend/worker.embeddings.js
          envFrom:
            - configMapRef:
                name: meetai-backend-config
            - secretRef:
                name: meetai-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
