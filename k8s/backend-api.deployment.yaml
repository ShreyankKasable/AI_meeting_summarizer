apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetai-backend-api
  namespace: meetai
  labels:
    app.kubernetes.io/name: ai-meeting-summarizer
    app.kubernetes.io/component: backend-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-meeting-summarizer
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-meeting-summarizer
        app.kubernetes.io/component: backend-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend-api
          image: ghcr.io/shreyankkasable/ai_meeting_summarizer/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: meetai-backend-config
            - secretRef:
                name: meetai-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
