apiVersion: v1
kind: Secret
metadata:
  name: meetai-backend-secret
  namespace: meetai
  labels:
    app.kubernetes.io/name: ai-meeting-summarizer
type: Opaque
stringData:
  SECRET_KEY: replace_with_a_long_random_value

  DATABASE_URL: postgresql://postgres.project_ref:password@host:5432/postgres
  REDIS_URL: rediss://default:password@host.upstash.io:6379

  DEEPGRAM_API_KEY: replace_with_deepgram_key
  HUGGINGFACE_API_KEY: replace_with_huggingface_token

  R2_ACCOUNT_ID: replace_with_cloudflare_account_id
  R2_ENDPOINT: ""
  R2_BUCKET: ai-meeting-recordings
  R2_ACCESS_KEY_ID: replace_with_r2_access_key_id
  R2_SECRET_ACCESS_KEY: replace_with_r2_secret_access_key

  NOTION_API_KEY: ""
  NOTION_DATABASE_ID: ""
