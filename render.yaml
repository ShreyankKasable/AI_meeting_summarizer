services:
  - type: web
    name: meetai-backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:combined
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGINS
        value: https://ai-meeting-summarizer-ashy-omega.vercel.app
      - key: DATABASE_SSL
        value: "true"
      - key: TRANSCRIPTION_MODEL
        value: deepgram
      - key: LLM_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: HUGGINGFACE_EMBEDDING_PROVIDER
        value: hf-inference
      - key: AUDIO_STORAGE_PROVIDER
        value: r2
      - key: AUDIO_COMPRESS_RECORDINGS
        value: "true"
      - key: AUDIO_STORAGE_FORMAT
        value: mp3
      - key: AUDIO_COMPRESSION_BITRATE_KBPS
        value: "48"
      - key: R2_REGION
        value: auto
      - key: R2_KEY_PREFIX
        value: recordings
      - key: NOTION_ENABLED
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
